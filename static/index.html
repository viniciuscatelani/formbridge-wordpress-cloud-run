<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guild Registry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="intro" aria-labelledby="page-title">
      <div class="crest" aria-hidden="true">20</div>
      <p class="eyebrow">Adventurers' Guild · Est. 1492 DR</p>
      <h1 id="page-title">Register your<br><span>next legend.</span></h1>
      <p class="lede">Every great campaign starts with a name. Add your adventurer to the guild ledger and prepare for the road ahead.</p>
      <div class="flourish" aria-hidden="true"><span></span>◆<span></span></div>
    </section>

    <section class="form-card" aria-labelledby="form-title">
      <div class="card-heading">
        <p>New entry</p>
        <h2 id="form-title">Character details</h2>
      </div>
      <form id="character-form">
        <label>
          Character name
          <input name="name" type="text" maxlength="80" placeholder="e.g. Elara Moonshadow" required autocomplete="off">
        </label>

        <label>
          Player name
          <input name="player_name" type="text" maxlength="80" placeholder="Who commands this hero?" required autocomplete="off">
        </label>

        <div class="field-row">
          <label>
            Class
            <select name="character_class" required>
              <option value="" selected disabled>Choose a class</option>
              <option>Barbarian</option><option>Bard</option><option>Cleric</option>
              <option>Druid</option><option>Fighter</option><option>Monk</option>
              <option>Paladin</option><option>Ranger</option><option>Rogue</option>
              <option>Sorcerer</option><option>Warlock</option><option>Wizard</option>
            </select>
          </label>
          <label>
            Level
            <input name="level" type="number" min="1" max="20" value="1" required>
          </label>
        </div>

        <label>
          Alignment
          <select name="alignment" required>
            <option value="" selected disabled>Choose an alignment</option>
            <option>Lawful Good</option><option>Neutral Good</option><option>Chaotic Good</option>
            <option>Lawful Neutral</option><option>True Neutral</option><option>Chaotic Neutral</option>
            <option>Lawful Evil</option><option>Neutral Evil</option><option>Chaotic Evil</option>
          </select>
        </label>

        <fieldset class="abilities">
          <legend>Ability scores <span>1–20</span></legend>
          <div class="ability-grid">
            <label>STR<input name="strength" type="number" min="1" max="20" value="10" required><output data-modifier="strength">+0</output></label>
            <label>DEX<input name="dexterity" type="number" min="1" max="20" value="10" required><output data-modifier="dexterity">+0</output></label>
            <label>CON<input name="constitution" type="number" min="1" max="20" value="10" required><output data-modifier="constitution">+0</output></label>
            <label>INT<input name="intelligence" type="number" min="1" max="20" value="10" required><output data-modifier="intelligence">+0</output></label>
            <label>WIS<input name="wisdom" type="number" min="1" max="20" value="10" required><output data-modifier="wisdom">+0</output></label>
            <label>CHA<input name="charisma" type="number" min="1" max="20" value="10" required><output data-modifier="charisma">+0</output></label>
          </div>
        </fieldset>

        <label>
          A note for the guild <span class="optional">Optional</span>
          <textarea name="notes" maxlength="500" rows="4" placeholder="A mysterious past, a sworn oath, an unusual fear…"></textarea>
        </label>

        <button type="submit"><span>Inscribe in the ledger</span><b aria-hidden="true">→</b></button>
        <p id="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
